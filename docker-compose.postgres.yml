# Local development Postgres only.
# Do not use these credentials or this compose file for production.

name: trpg-platform-postgres-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: trpg-platform-postgres-dev
    restart: unless-stopped
    ports:
      # Non-default host port to reduce conflicts with an existing local Postgres.
      - "55432:5432"
    environment:
      POSTGRES_DB: trpg_platform_dev
      POSTGRES_USER: trpg_local
      POSTGRES_PASSWORD: trpg_local_password
    volumes:
      - trpg_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trpg_local -d trpg_platform_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trpg_postgres_dev_data:
